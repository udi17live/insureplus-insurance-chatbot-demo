services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${ACR_LOGIN_SERVER}/insureplus-backend:${IMAGE_TAG:-latest}
    restart: always
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
