trigger:
  branches:
    include:
      - release

variables:
  - group: insure-plus-prod-vars
  - name: acrName
    value: insureplusacr
  - name: acrServer
    value: insureplusacr.azurecr.io
  - name: resourceGroup
    value: insure-plus-rg
  - name: containerAppsEnv
    value: insure-plus-env
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: Build & Push Images
    jobs:
      - job: BuildBackend
        displayName: Build Backend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push backend image
            inputs:
              command: buildAndPush
              containerRegistry: insure-plus-acr-connection
              repository: backend
              dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(imageTag)
                latest

      - job: BuildFrontend
        displayName: Build Frontend
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: insure-plus-acr-connection
              repository: frontend
              dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(imageTag)
                latest

  - stage: Deploy
    displayName: Deploy to Container Apps
    dependsOn: Build
    jobs:
      - deployment: DeployBackend
        displayName: Deploy Backend
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy backend container app
                  inputs:
                    azureSubscription: insure-plus-azure-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name insure-plus-backend \
                        --resource-group $(resourceGroup) \
                        --image $(acrServer)/backend:$(imageTag) \
                      || az containerapp create \
                        --name insure-plus-backend \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppsEnv) \
                        --image $(acrServer)/backend:$(imageTag) \
                        --registry-server $(acrServer) \
                        --target-port 8000 \
                        --ingress external \
                        --min-replicas 1 \
                        --max-replicas 3 \
                        --env-vars \
                          APP_NAME="Insure Plus API" \
                          DEBUG=false \
                          DATABASE_URL="$(DATABASE_URL)" \
                          REDIS_URL="$(REDIS_URL)" \
                          JWT_SECRET_KEY="$(JWT_SECRET_KEY)" \
                          JWT_ALGORITHM=HS256 \
                          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60 \
                          AZURE_TENANT_ID="$(AZURE_TENANT_ID)" \
                          AZURE_CLIENT_ID="$(AZURE_CLIENT_ID)" \
                          AZURE_CLIENT_SECRET="$(AZURE_CLIENT_SECRET)" \
                          AZURE_AI_PROJECT_BASE_ENDPOINT="$(AZURE_AI_PROJECT_BASE_ENDPOINT)" \
                          PRIMARY_AGENT_ID="$(PRIMARY_AGENT_ID)" \
                          AGENT_API_KEY="$(AGENT_API_KEY)" \
                          AGENT_MAX_COMPLETION_TOKENS=600 \
                          ALLOWED_ORIGINS="$(ALLOWED_ORIGINS)"

      - deployment: DeployFrontend
        displayName: Deploy Frontend
        dependsOn: DeployBackend
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy frontend container app
                  inputs:
                    azureSubscription: insure-plus-azure-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name insure-plus-frontend \
                        --resource-group $(resourceGroup) \
                        --image $(acrServer)/frontend:$(imageTag) \
                      || az containerapp create \
                        --name insure-plus-frontend \
                        --resource-group $(resourceGroup) \
                        --environment $(containerAppsEnv) \
                        --image $(acrServer)/frontend:$(imageTag) \
                        --registry-server $(acrServer) \
                        --target-port 3000 \
                        --ingress external \
                        --min-replicas 1 \
                        --env-vars \
                          NEXT_PUBLIC_API_URL="$(NEXT_PUBLIC_API_URL)"
